name: Evaluation

# retrieval: free, runs on every PR that touches the pipeline.
# answer:    costs API money. Runs the 20-question CI subset on PRs that touch the
#            pipeline, and the full 102 questions when started by hand.

on:
  pull_request:
    paths:
      - "src/**"
      - "webapp/answering.py"
      - "eval/**"
  workflow_dispatch:
    inputs:
      subset:
        description: "Questions to run"
        type: choice
        options: [ci, all]
        default: all
      tier:
        description: "public = OpenAI model, locked = Claude"
        type: choice
        options: [public, locked]
        default: public
      max_usd:
        description: "Spend cap for this run (USD)"
        default: "2.00"

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.filings.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check benchmark filings are present
        id: filings
        run: |
          n=$(find eval/filings -type f ! -name README.txt | wc -l)
          if [ "$n" -ge 12 ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Only $n of 12 benchmark filings in eval/filings; skipping evaluation."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.filings.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - if: steps.filings.outputs.ready == 'true'
        run: pip install -r requirements-dev.txt
      - name: Retrieval eval (no API calls)
        if: steps.filings.outputs.ready == 'true'
        # Raise EVAL_MIN_RECALL (repo Settings > Variables) once a baseline is recorded.
        run: >
          python eval/run_eval.py retrieval
          --min-recall ${{ vars.EVAL_MIN_RECALL || '0' }}
          --out eval/reports/retrieval.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.filings.outputs.ready == 'true'
        with:
          name: retrieval-report
          path: eval/reports/

  answer:
    runs-on: ubuntu-latest
    needs: retrieval
    # Secrets are not available to PRs from forks; skip cleanly there.
    if: >
      needs.retrieval.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Answer eval
        # Raise EVAL_MIN_ACCURACY once a baseline is recorded; 0 = report only.
        run: >
          python eval/run_eval.py answer
          --subset ${{ inputs.subset || 'ci' }}
          --tier ${{ inputs.tier || 'public' }}
          --max-usd ${{ inputs.max_usd || '0.50' }}
          --min-accuracy ${{ vars.EVAL_MIN_ACCURACY || '0' }}
          --out eval/reports/answer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-report
          path: eval/reports/
